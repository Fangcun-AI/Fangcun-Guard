[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fangcunguard-router"
version = "0.1.0"
description = "Intelligent multi-model safety router for LLM applications"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "FangcunGuard Team"}]
keywords = ["ai-safety", "guardrails", "llm", "content-moderation", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
train = ["torch>=2.0.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/fangcunguard/fangcunguard-router"
Repository = "https://github.com/fangcunguard/fangcunguard-router"
Documentation = "https://github.com/fangcunguard/fangcunguard-router#readme"
