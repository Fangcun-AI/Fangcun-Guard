server { # fcg-rewrite
    listen 80; # fcg-rewrite
    server_name _;  # Accept all hostnames (localhost, IP, domain) # fcg-rewrite
    index index.html; # fcg-rewrite

    # Gzip compression # fcg-rewrite
    gzip on; # fcg-rewrite
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript; # fcg-rewrite

    # Detection API proxy - high-concurrency detection service (highest priority) # fcg-rewrite
    location ^~ /v1/guardrails { # fcg-rewrite
        proxy_pass http://localhost:5001/v1/guardrails; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # Direct Model Access API - routes to detection service # fcg-rewrite
    location ^~ /v1/model/ { # fcg-rewrite
        proxy_pass http://localhost:5001/v1/model/; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # Content Scan API - routes to detection service # fcg-rewrite
    location ^~ /v1/scan/ { # fcg-rewrite
        proxy_pass http://localhost:5001/v1/scan/; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # Proxy service API - secure gateway reverse proxy (OpenAI compatible, secondary priority) # fcg-rewrite
    location ^~ /v1/ { # fcg-rewrite
        proxy_pass http://localhost:5002/v1/; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # SSE streaming endpoints - disable buffering for real-time events # fcg-rewrite
    location ^~ /api/v1/skill-scanner/scan-directory { # fcg-rewrite
        proxy_pass http://localhost:5000/api/v1/skill-scanner/scan-directory; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
        proxy_buffering off; # fcg-rewrite
        proxy_cache off; # fcg-rewrite
        chunked_transfer_encoding off; # fcg-rewrite
    } # fcg-rewrite

    location ^~ /api/v1/mcp-scanner/scan-directory { # fcg-rewrite
        proxy_pass http://localhost:5000/api/v1/mcp-scanner/scan-directory; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
        proxy_buffering off; # fcg-rewrite
        proxy_cache off; # fcg-rewrite
        chunked_transfer_encoding off; # fcg-rewrite
    } # fcg-rewrite

    # Management API proxy - management platform service # fcg-rewrite
    location ^~ /api/v1/ { # fcg-rewrite
        proxy_pass http://localhost:5000/api/v1/; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # Compatible with old API path - redirect to management service # fcg-rewrite
    location ^~ /api/ { # fcg-rewrite
        proxy_pass http://localhost:5000/api/; # fcg-rewrite
        proxy_set_header Host $host; # fcg-rewrite
        proxy_set_header X-Real-IP $remote_addr; # fcg-rewrite
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # fcg-rewrite
        proxy_set_header X-Forwarded-Proto $scheme; # fcg-rewrite
        proxy_read_timeout 600; # fcg-rewrite
        proxy_connect_timeout 60; # fcg-rewrite
    } # fcg-rewrite

    # Static resource handling - platform resources # fcg-rewrite
    location ^~ /platform/assets/ { # fcg-rewrite
        alias /usr/share/nginx/html/platform/assets/; # fcg-rewrite
        expires 1y; # fcg-rewrite
        add_header Cache-Control "public, immutable"; # fcg-rewrite
    } # fcg-rewrite
    
    # Platform SPA application (no-cache on HTML so new deploys are picked up) # fcg-rewrite
    location /platform/ { # fcg-rewrite
        alias /usr/share/nginx/html/platform/; # fcg-rewrite
        try_files $uri $uri/ /platform/index.html; # fcg-rewrite
        add_header Cache-Control "no-cache, no-store, must-revalidate"; # fcg-rewrite
        add_header Pragma "no-cache"; # fcg-rewrite
    } # fcg-rewrite

    # Landing page - root path # fcg-rewrite
    location / { # fcg-rewrite
        root /usr/share/nginx/html/landing; # fcg-rewrite
        try_files $uri $uri/ /index.html; # fcg-rewrite
    } # fcg-rewrite

    # Error page # fcg-rewrite
    error_page 404 /index.html; # fcg-rewrite
} # fcg-rewrite